<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flux - Rede Social Efêmera</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Usando a biblioteca MQTT via CDN -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #000000;
            color: #e7e9ea;
            margin: 0;
            overflow: hidden;
            height: 100vh;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #000000;
        }
        ::-webkit-scrollbar-thumb {
            background-color: #333639;
            border-radius: 10px;
        }

        .screen {
            display: none;
            height: 100%;
            width: 100%;
            flex-direction: column;
            align-items: center;
        }
        .screen.active {
            display: flex;
        }

        /* Animação para novos posts entrarem suavemente */
        .post-enter {
            animation: slideDown 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(-20px);
        }

        @keyframes slideDown {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Estilização customizada para o color picker */
        input[type="color"] {
            -webkit-appearance: none;
            border: none;
            width: 100%;
            height: 40px;
            border-radius: 8px;
            cursor: pointer;
            padding: 0;
            background: none;
        }
        input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }
        input[type="color"]::-webkit-color-swatch {
            border: 2px solid #333639;
            border-radius: 8px;
        }
        
        .like-anim {
            animation: heartPop 0.3s ease-in-out;
        }

        @keyframes heartPop {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <!-- Tela 1: Criação de Perfil Rápido -->
    <div id="screen-setup" class="screen active justify-center p-6">
        <div class="max-w-sm w-full bg-[#16181c] p-8 rounded-2xl border border-[#333639]">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold tracking-tight text-white mb-2">Flux.</h1>
                <p class="text-[#71767b] text-sm">Transmissão ao vivo. Sem rastros.</p>
            </div>

            <div class="space-y-6">
                <div>
                    <label class="block text-sm font-medium text-[#71767b] mb-2">Seu nome de agora</label>
                    <input type="text" id="input-name" placeholder="Ex: Viajante Oculto" maxlength="20"
                        class="w-full bg-[#202327] border border-[#333639] text-white rounded-xl px-4 py-3 focus:outline-none focus:border-[#1d9bf0] transition-colors">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-[#71767b] mb-2">Cor do Nome</label>
                        <input type="color" id="input-name-color" value="#1d9bf0">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-[#71767b] mb-2">Cor do Texto</label>
                        <input type="color" id="input-text-color" value="#e7e9ea">
                    </div>
                </div>

                <!-- Preview Box -->
                <div class="mt-4 p-4 rounded-xl bg-[#000000] border border-[#333639]">
                    <p class="text-xs text-[#71767b] mb-2 uppercase tracking-wide">Preview</p>
                    <div class="font-bold" id="preview-name" style="color: #1d9bf0;">Viajante Oculto</div>
                    <div class="mt-1 break-words" id="preview-text" style="color: #e7e9ea;">Assim que meu post vai ficar no fluxo global.</div>
                </div>

                <button id="btn-enter" class="w-full bg-white text-black font-bold py-3.5 rounded-full text-md hover:bg-gray-200 transition-colors mt-4 opacity-50 cursor-not-allowed" disabled>
                    Conectando Satélite...
                </button>
            </div>
        </div>
    </div>

    <!-- Tela 2: Feed Global -->
    <div id="screen-feed" class="screen">
        <div class="w-full max-w-2xl h-full flex flex-col border-x border-[#2f3336]">
            
            <!-- Header -->
            <div class="sticky top-0 z-10 bg-black/80 backdrop-blur-md border-b border-[#2f3336] p-4 flex justify-between items-center cursor-pointer" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">
                <div class="flex items-center gap-2">
                    <h1 class="text-xl font-bold">Flux</h1>
                    <span id="conn-status" class="w-2 h-2 rounded-full bg-red-500 animate-pulse" title="Status da Conexão"></span>
                </div>
                <div id="my-current-profile" class="text-sm font-medium px-3 py-1 bg-[#16181c] rounded-full border border-[#333639]">
                    <!-- Preenchido via JS -->
                </div>
            </div>

            <!-- Composer (Área de postar) -->
            <div class="p-4 border-b border-[#2f3336] flex gap-4">
                <div class="flex-1">
                    <textarea id="post-input" placeholder="O que está acontecendo no mundo?" rows="2" maxlength="280"
                        class="w-full bg-transparent text-xl outline-none resize-none placeholder-[#71767b] overflow-hidden"></textarea>
                    
                    <div class="flex justify-between items-center mt-3 pt-3 border-t border-[#2f3336]">
                        <span id="char-count" class="text-xs text-[#71767b]">0 / 280</span>
                        <button id="btn-post" class="bg-[#1d9bf0] hover:bg-[#1a8cd8] text-white font-bold py-1.5 px-5 rounded-full transition-colors disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                            Postar
                        </button>
                    </div>
                </div>
            </div>

            <!-- Feed Stream -->
            <div id="feed-stream" class="flex-1 overflow-y-auto pb-20">
                <div id="feed-loading" class="text-center p-12 text-[#71767b]">
                    <div class="inline-block w-6 h-6 border-2 border-[#71767b] border-t-[#1d9bf0] rounded-full animate-spin mb-4"></div>
                    <h3 class="text-xl font-bold mb-2 text-white">Sintonizado na Frequência</h3>
                    <p>O feed é ao vivo e efêmero.</p>
                    <p class="text-sm mt-1">Aguardando alguém falar algo...</p>
                </div>
                <!-- Posts entram aqui -->
            </div>
        </div>
    </div>

    <script>
        // Configurações MQTT (Nossa infraestrutura global "Satélite")
        const brokerUrl = 'wss://broker.emqx.io:8084/mqtt'; // Websocket seguro
        const FEED_TOPIC = 'flux-global-ephemeral-net/feed';
        const ACTION_TOPIC = 'flux-global-ephemeral-net/actions';
        
        let client = null;
        let isConnected = false;
        
        // Memória local volátil (não salvamos nada em banco)
        // Guardamos apenas os últimos 50 posts na memória RAM da aba
        let localPostsMemory = []; 

        // Gerar um ID único temporário para esta sessão
        const myUid = 'user_' + Math.random().toString(36).substr(2, 9);
        
        let currentUser = {
            name: '',
            nameColor: '#1d9bf0',
            textColor: '#e7e9ea'
        };

        // Elementos DOM
        const screenSetup = document.getElementById('screen-setup');
        const screenFeed = document.getElementById('screen-feed');
        const inputName = document.getElementById('input-name');
        const inputNameColor = document.getElementById('input-name-color');
        const inputTextColor = document.getElementById('input-text-color');
        const previewName = document.getElementById('preview-name');
        const previewText = document.getElementById('preview-text');
        const btnEnter = document.getElementById('btn-enter');
        
        const postInput = document.getElementById('post-input');
        const charCount = document.getElementById('char-count');
        const btnPost = document.getElementById('btn-post');
        const feedStream = document.getElementById('feed-stream');
        const feedLoading = document.getElementById('feed-loading');
        const myCurrentProfile = document.getElementById('my-current-profile');
        const connStatus = document.getElementById('conn-status');

        // Atualizar Preview no Setup
        function updatePreview() {
            const name = inputName.value.trim() || 'Viajante Oculto';
            previewName.textContent = name;
            previewName.style.color = inputNameColor.value;
            previewText.style.color = inputTextColor.value;
            postInput.style.color = inputTextColor.value;
        }

        inputName.addEventListener('input', updatePreview);
        inputNameColor.addEventListener('input', updatePreview);
        inputTextColor.addEventListener('input', updatePreview);

        // Lógica do Input de Texto (Auto-resize)
        postInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
            
            const len = this.value.trim().length;
            charCount.textContent = `${len} / 280`;
            
            if (len > 0 && len <= 280 && isConnected) {
                btnPost.disabled = false;
            } else {
                btnPost.disabled = true;
            }
        });

        // Conectar ao Broker MQTT Global
        function connectToSatellite() {
            client = mqtt.connect(brokerUrl);

            client.on('connect', () => {
                isConnected = true;
                connStatus.classList.replace('bg-red-500', 'bg-green-500');
                connStatus.classList.remove('animate-pulse');
                
                // Liberar botão de entrar
                btnEnter.textContent = "Entrar no Fluxo";
                btnEnter.disabled = false;
                btnEnter.classList.remove('opacity-50', 'cursor-not-allowed');

                // Inscrever nos tópicos globais
                client.subscribe(FEED_TOPIC);
                client.subscribe(ACTION_TOPIC);
            });

            client.on('error', (err) => {
                console.error("Erro no satélite:", err);
                btnEnter.textContent = "Sinal Perdido. Reconectando...";
            });

            client.on('reconnect', () => {
                isConnected = false;
                connStatus.classList.replace('bg-green-500', 'bg-red-500');
                connStatus.classList.add('animate-pulse');
                btnEnter.disabled = true;
            });

            // Escutar mensagens recebidas da rede
            client.on('message', (topic, message) => {
                try {
                    const payload = JSON.parse(message.toString());
                    
                    if (topic === FEED_TOPIC) {
                        handleNewPost(payload);
                    } else if (topic === ACTION_TOPIC) {
                        handleAction(payload);
                    }
                } catch (e) {
                    console.error("Mensagem corrompida", e);
                }
            });
        }

        // Iniciar conexão
        connectToSatellite();

        // Entrar na rede
        btnEnter.addEventListener('click', () => {
            if (!isConnected) return;
            
            let name = inputName.value.trim();
            if (!name) name = 'Anônimo_' + Math.floor(Math.random() * 1000);

            currentUser.name = name;
            currentUser.nameColor = inputNameColor.value;
            currentUser.textColor = inputTextColor.value;

            myCurrentProfile.textContent = name;
            myCurrentProfile.style.color = currentUser.nameColor;

            screenSetup.classList.remove('active');
            screenFeed.classList.add('active');
        });

        // Enviar Novo Post para a Rede
        btnPost.addEventListener('click', () => {
            if (!isConnected) return;
            
            const text = postInput.value.trim();
            if (!text || text.length > 280) return;

            // Criar pacote de dados
            const postData = {
                id: 'post_' + Math.random().toString(36).substr(2, 9),
                author: currentUser.name,
                authorColor: currentUser.nameColor,
                content: text,
                textColor: currentUser.textColor,
                createdAt: Date.now(),
                isRepost: false,
                likedBy: []
            };

            // Publicar na rede (Satélite)
            client.publish(FEED_TOPIC, JSON.stringify(postData), { qos: 1 });
            
            // Limpar UI
            postInput.value = '';
            postInput.style.height = 'auto';
            charCount.textContent = '0 / 280';
            btnPost.disabled = true;
            postInput.focus();
        });

        // Função global de Curtir (enviada via MQTT)
        window.handleLike = (postId) => {
            if (!isConnected) return;
            
            // Publicar ação na rede
            const actionData = {
                type: 'like',
                postId: postId,
                likerId: myUid
            };
            
            client.publish(ACTION_TOPIC, JSON.stringify(actionData), { qos: 1 });
        };

        // Função global de Repostar (enviada via MQTT)
        window.handleRepost = (postId) => {
            if (!isConnected) return;
            
            // Encontrar o post na memória local
            const originalPost = localPostsMemory.find(p => p.id === postId);
            if (!originalPost) return;

            const repostData = {
                id: 'repost_' + Math.random().toString(36).substr(2, 9),
                author: originalPost.isRepost ? originalPost.author : originalPost.author,
                authorColor: originalPost.isRepost ? originalPost.authorColor : originalPost.authorColor,
                content: originalPost.content,
                textColor: originalPost.isRepost ? originalPost.textColor : originalPost.textColor,
                createdAt: Date.now(),
                isRepost: true,
                reposterName: currentUser.name,
                likedBy: []
            };

            client.publish(FEED_TOPIC, JSON.stringify(repostData), { qos: 1 });
        };

        // Lidar com novos posts recebidos do Satélite
        function handleNewPost(post) {
            // Adicionar à memória local no topo
            localPostsMemory.unshift(post);
            
            // Limitar a memória a 50 posts para não travar o navegador
            if (localPostsMemory.length > 50) {
                localPostsMemory.pop(); 
            }
            
            renderFeed();
        }

        // Lidar com ações (Likes) recebidos
        function handleAction(action) {
            if (action.type === 'like') {
                const post = localPostsMemory.find(p => p.id === action.postId);
                if (post) {
                    if (!post.likedBy) post.likedBy = [];
                    
                    // Toggle Like: se já curtiu, descurte. Se não, curte.
                    const likeIndex = post.likedBy.indexOf(action.likerId);
                    if (likeIndex > -1) {
                        post.likedBy.splice(likeIndex, 1);
                    } else {
                        post.likedBy.push(action.likerId);
                    }
                    
                    // Atualiza a UI inteira (rápido o suficiente para 50 posts)
                    renderFeed();
                }
            }
        }

        function renderFeed() {
            if (feedLoading && localPostsMemory.length > 0) {
                feedLoading.style.display = 'none';
            }
            
            let html = '';
            localPostsMemory.forEach(post => {
                // Prevenção básica de XSS
                const safeContent = document.createTextNode(post.content).textContent;
                const safeAuthor = document.createTextNode(post.author).textContent;
                
                const timeStr = getRelativeTime(post.createdAt);
                
                const isLiked = post.likedBy && post.likedBy.includes(myUid);
                const likeCount = post.likedBy ? post.likedBy.length : 0;
                
                const likeIconColor = isLiked ? '#f91880' : '#71767b';
                const likeFill = isLiked ? 'currentColor' : 'none';

                let repostHeader = '';
                if (post.isRepost) {
                    const reposterName = document.createTextNode(post.reposterName).textContent;
                    repostHeader = `
                        <div class="flex items-center text-xs text-[#71767b] mb-1 font-medium ml-8">
                            <svg class="w-3 h-3 mr-2" fill="currentColor" viewBox="0 0 24 24"><path d="M4.5 3.88l4.432 4.14-1.364 1.46L5.5 7.55V16c0 1.1.896 2 2 2H13v2H7.5c-2.209 0-4-1.79-4-4V7.55L1.432 9.48.068 8.02 4.5 3.88zM16.5 6H11V4h5.5c2.209 0 4 1.79 4 4v8.45l2.068-1.93 1.364 1.46-4.432 4.14-4.432-4.14 1.364-1.46 2.068 1.93V8c0-1.1-.896-2-2-2z"/></svg>
                            ${reposterName} repostou
                        </div>
                    `;
                }

                html += `
                    <div class="p-4 border-b border-[#2f3336] hover:bg-[#080808] transition-colors post-enter" id="${post.id}">
                        ${repostHeader}
                        <div class="flex gap-3">
                            <div class="w-10 h-10 rounded-full flex-shrink-0 flex items-center justify-center font-bold text-lg" 
                                style="background-color: ${post.authorColor}20; color: ${post.authorColor}; border: 1px solid ${post.authorColor}50">
                                ${safeAuthor.charAt(0).toUpperCase()}
                            </div>
                            
                            <div class="flex-1 min-w-0">
                                <div class="flex items-center gap-2 mb-1">
                                    <span class="font-bold truncate" style="color: ${post.authorColor}">${safeAuthor}</span>
                                    <span class="text-[#71767b] text-sm">· ${timeStr}</span>
                                </div>
                                
                                <div class="text-[15px] leading-relaxed break-words" style="color: ${post.textColor}">
                                    ${safeContent}
                                </div>
                                
                                <div class="flex items-center gap-12 mt-3 text-[#71767b]">
                                    <button class="flex items-center gap-2 text-sm hover:text-[#00ba7c] transition-colors group" onclick="window.handleRepost('${post.id}')">
                                        <div class="p-2 rounded-full group-hover:bg-[#00ba7c]/10 transition-colors">
                                            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4.5 3.88l4.432 4.14-1.364 1.46L5.5 7.55V16c0 1.1.896 2 2 2H13v2H7.5c-2.209 0-4-1.79-4-4V7.55L1.432 9.48.068 8.02 4.5 3.88zM16.5 6H11V4h5.5c2.209 0 4 1.79 4 4v8.45l2.068-1.93 1.364 1.46-4.432 4.14-4.432-4.14 1.364-1.46 2.068 1.93V8c0-1.1-.896-2-2-2z"/></svg>
                                        </div>
                                    </button>
                                    
                                    <button class="flex items-center gap-2 text-sm hover:text-[#f91880] transition-colors group" onclick="window.handleLike('${post.id}')">
                                        <div class="p-2 rounded-full group-hover:bg-[#f91880]/10 transition-colors">
                                            <svg class="w-4 h-4 ${isLiked ? 'like-anim' : ''}" fill="${likeFill}" stroke="${likeIconColor}" stroke-width="2" viewBox="0 0 24 24" style="color: ${likeIconColor}">
                                                <path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path>
                                            </svg>
                                        </div>
                                        <span class="${isLiked ? 'text-[#f91880]' : ''}">${likeCount > 0 ? likeCount : ''}</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });

            // Atualiza apenas se existirem posts, para não remover o aviso de "Aguardando" atoa
            if (localPostsMemory.length > 0) {
                feedStream.innerHTML = html;
            }
        }

        // Função de utilidade de tempo
        function getRelativeTime(timestamp) {
            const minutesDifference = Math.floor((Date.now() - timestamp) / 60000);
            if (minutesDifference < 1) return 'Agora';
            if (minutesDifference < 60) return `${minutesDifference}m`;
            const hoursDifference = Math.floor(minutesDifference / 60);
            if (hoursDifference < 24) return `${hoursDifference}h`;
            return `${Math.floor(hoursDifference / 24)}d`;
        }
    </script>
</body>
</html>
